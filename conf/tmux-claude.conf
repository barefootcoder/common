# Minimal tmux config for wrapping Claude Code.
# tmux is used purely as a rendering buffer -- it absorbs Claude's full-screen
# TUI redraws and only forwards diffs to the outer terminal (screen).
# The user never interacts with tmux directly.

set -g status off
set -g history-limit 0
set -g escape-time 0
set -g remain-on-exit on

# Let Enter and q dismiss a dead pane, but pass through normally while Claude
# is running.  This avoids the pane-died hook approach, which leaked server-
# global bindings that persisted across sessions on the same socket.
bind -n Enter if-shell -F "#{pane_dead}" "kill-session" "send-keys Enter"
bind -n q     if-shell -F "#{pane_dead}" "kill-session" "send-keys q"
