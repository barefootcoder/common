# kitty configuration
# symlinked from ~/common/conf/kitty/ by makeln

# don't blink the cursor
cursor_blink_interval 0

# disable scrollback entirely: keep no terminal history at all -- no in-RAM
# buffer and no on-disk pager spill.  Screen provides its own scrollback via
# copy mode, so nothing is lost; keeping none here means a displayed secret
# can't linger in kitty's buffer.
scrollback_lines 0
scrollback_pager_history_size 0

# quieter bell: disable built-in audio, play our own quieter sound via command
# other options in this directory: bell-sonar.wav, bell-dialog-warning.wav, bell-chime-harmonic.wav
enable_audio_bell no
command_on_bell paplay ~/common/conf/kitty/bell-relaxing-chime.wav

# make bold text also use bright color variant, so bold remains visually
# distinct even through the tmux rendering buffer (which loses font weight
# changes somewhere in the screen pty chain)
bold_is_bright yes

# use the Black face for bold cells: Inconsolata's Bold (700) is too subtle
# a step up from Regular at terminal sizes, so jump to Black (900) instead.
# Regular text is unaffected (font_family comes from myterm's command line).
# Chosen via side-by-side comparison 2026-06-05; faces installed by
# setup/home-dir.setup from /var/install/Inconsolata.zip.
bold_font Inconsolata Black

# change blue to cyan for readability on dark backgrounds
# (matches URxvt.color4/color12 in Xresources)
color4  #00FFFF
color12 #80FFFF

# translate Ctrl+Enter to Alt+Enter (ESC + CR) at the terminal layer.
# Ctrl+Enter and Enter are indistinguishable in basic terminal mode (both
# send CR), and the Kitty keyboard protocol that would disambiguate them
# gets stripped by GNU screen. So we rewrite the keystroke here, before
# screen sees it, into the universally-portable Alt+Enter byte sequence.
# Lets Claude Code (and any TUI that handles meta+enter) treat Ctrl+Enter
# as a distinct submit key.
map ctrl+enter send_text all \x1b\r
